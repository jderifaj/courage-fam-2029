<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content Manager · 2029 NC Courage Academy</title>
    <style>
      /* Decap's internal component class names have a build-hash prefix that
         changes between versions, plus a semantic suffix that's far more
         stable — we target only that semantic part, and only real HTML
         elements (nav) where possible, to keep this from breaking silently
         on a Decap update. Worst case if it ever does: these small touches
         just stop appearing, nothing else is affected. */
      nav {
        display: flex;
        align-items: center;
      }

      nav::after {
        content: 'Admin Section';
        margin-left: 1rem;
        font-family: Georgia, serif;
        font-weight: 700;
        color: #0b2545;
        font-size: 0.95rem;
      }

      li[class*='ListCard-card-card'] {
        position: relative;
      }

      a[class*='ListCardLink']::after {
        content: '\270F\FE0F';
        position: absolute;
        top: 50%;
        right: 1.25rem;
        transform: translateY(-50%);
        font-size: 1.1rem;
      }
    </style>
  </head>
  <body>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
      var NAVY = '#0b2545';
      var GREEN = '#3f9a6e';
      var GREEN_DARK = '#2f7854';
      var MUTED = '#5b6b7c';

      function resolveAssetUrl(getAsset, path) {
        if (!path) return null;
        var asset = getAsset(path);
        return asset ? asset.toString() : null;
      }

      // Custom "focalpoint" widget: click or drag on a photo to choose which
      // part of it stays visible when object-fit: cover crops it on the site.
      // Value is stored as a plain CSS object-position string, e.g. "30% 50%".
      function clampPercent(n) {
        return Math.max(0, Math.min(100, n));
      }

      function parseFocalPoint(value) {
        var match = typeof value === 'string' && value.match(/(-?\d+(?:\.\d+)?)%\s+(-?\d+(?:\.\d+)?)%/);
        if (match) {
          return { x: clampPercent(parseFloat(match[1])), y: clampPercent(parseFloat(match[2])) };
        }
        return { x: 50, y: 50 };
      }

      function formatFocalPoint(point) {
        return Math.round(point.x) + '% ' + Math.round(point.y) + '%';
      }

      var FocalPointControl = createClass({
        getInitialState: function () {
          return { dragging: false };
        },

        setFromEvent: function (e) {
          var node = this.previewNode;
          if (!node) return;
          var rect = node.getBoundingClientRect();
          var touch = e.touches && e.touches[0];
          var clientX = touch ? touch.clientX : e.clientX;
          var clientY = touch ? touch.clientY : e.clientY;
          var point = {
            x: clampPercent(((clientX - rect.left) / rect.width) * 100),
            y: clampPercent(((clientY - rect.top) / rect.height) * 100),
          };
          this.props.onChange(formatFocalPoint(point));
        },

        handleMouseDown: function (e) {
          e.preventDefault();
          this.setState({ dragging: true });
          this.setFromEvent(e);
          window.addEventListener('mousemove', this.handleMouseMove);
          window.addEventListener('mouseup', this.handleMouseUp);
        },
        handleMouseMove: function (e) {
          this.setFromEvent(e);
        },
        handleMouseUp: function () {
          this.setState({ dragging: false });
          window.removeEventListener('mousemove', this.handleMouseMove);
          window.removeEventListener('mouseup', this.handleMouseUp);
        },
        handleTouchStart: function (e) {
          this.setState({ dragging: true });
          this.setFromEvent(e);
        },
        handleTouchMove: function (e) {
          e.preventDefault();
          this.setFromEvent(e);
        },
        handleTouchEnd: function () {
          this.setState({ dragging: false });
        },
        handleReset: function (e) {
          e.preventDefault();
          this.props.onChange('50% 50%');
        },
        componentWillUnmount: function () {
          window.removeEventListener('mousemove', this.handleMouseMove);
          window.removeEventListener('mouseup', this.handleMouseUp);
        },

        render: function () {
          var props = this.props;
          var self = this;
          var imageFieldName = (props.field.get && props.field.get('image_field')) || 'photo';
          var entryData = props.entry && props.entry.get('data');
          var photoPath = entryData && entryData.get(imageFieldName);
          var photoUrl = photoPath ? resolveAssetUrl(props.getAsset, photoPath) : null;
          var point = parseFocalPoint(props.value);

          if (!photoUrl) {
            return h(
              'p',
              { style: { color: '#5b6b7c', fontStyle: 'italic', margin: 0 } },
              'Upload a photo above first, then come back here to set the focus point.'
            );
          }

          return h(
            'div',
            {},
            h(
              'div',
              {
                ref: function (node) {
                  self.previewNode = node;
                },
                onMouseDown: this.handleMouseDown,
                onTouchStart: this.handleTouchStart,
                onTouchMove: this.handleTouchMove,
                onTouchEnd: this.handleTouchEnd,
                style: {
                  position: 'relative',
                  width: '100%',
                  maxWidth: '360px',
                  aspectRatio: '4 / 3',
                  overflow: 'hidden',
                  borderRadius: '6px',
                  cursor: this.state.dragging ? 'grabbing' : 'crosshair',
                  border: '2px solid #d7dee5',
                  userSelect: 'none',
                  touchAction: 'none',
                },
              },
              h('img', {
                src: photoUrl,
                draggable: false,
                style: { width: '100%', height: '100%', objectFit: 'cover', display: 'block', pointerEvents: 'none' },
              }),
              h('div', {
                style: {
                  position: 'absolute',
                  left: point.x + '%',
                  top: point.y + '%',
                  width: '22px',
                  height: '22px',
                  marginLeft: '-11px',
                  marginTop: '-11px',
                  borderRadius: '50%',
                  border: '2px solid #fff',
                  boxShadow: '0 0 0 2px ' + GREEN + ', 0 1px 4px rgba(0,0,0,0.5)',
                  background: 'rgba(63,154,110,0.35)',
                  pointerEvents: 'none',
                },
              })
            ),
            h(
              'div',
              { style: { marginTop: '0.5rem', display: 'flex', alignItems: 'center', gap: '0.75rem' } },
              h('span', { style: { fontSize: '0.85rem', color: MUTED } }, 'Focus: ' + formatFocalPoint(point)),
              h('button', { type: 'button', onClick: this.handleReset, style: { fontSize: '0.85rem' } }, 'Reset to center')
            )
          );
        },
      });

      var FocalPointPreview = createClass({
        render: function () {
          return h('span', {}, this.props.value || '50% 50%');
        },
      });

      CMS.registerWidget('focalpoint', FocalPointControl, FocalPointPreview);

      var FamilyPreview = createClass({
        render: function () {
          var data = this.props.entry.get('data');
          var photoUrl = resolveAssetUrl(this.props.getAsset, data.get('photo'));
          var photoAlt = data.get('photoAlt');
          var jerseyNumber = data.get('jerseyNumber');
          var photoPosition = data.get('photoPosition') || '50% 50%';

          return h(
            'div',
            { style: { fontFamily: 'Georgia, serif', color: '#1a2634' } },
            photoUrl &&
              h(
                'div',
                { style: { position: 'relative' } },
                h('img', {
                  src: photoUrl,
                  alt: photoAlt || data.get('familyName'),
                  style: { width: '100%', maxHeight: '420px', objectFit: 'cover', objectPosition: photoPosition, display: 'block' },
                }),
                photoAlt &&
                  h(
                    'p',
                    {
                      style: {
                        position: 'absolute',
                        bottom: 0,
                        left: 0,
                        right: 0,
                        margin: 0,
                        padding: '10px 16px',
                        background: 'rgba(255,255,255,0.8)',
                        color: NAVY,
                        fontWeight: 700,
                      },
                    },
                    photoAlt
                  )
              ),
            h(
              'div',
              { style: { padding: '1.25rem' } },
              h(
                'span',
                {
                  style: {
                    display: 'inline-block',
                    background: GREEN,
                    color: '#fff',
                    fontWeight: 700,
                    fontSize: '0.85rem',
                    padding: '0.3rem 0.8rem',
                    borderRadius: '999px',
                    marginBottom: '0.75rem',
                  },
                },
                'Player: ' + (data.get('playerName') || '') + (jerseyNumber ? ' · #' + jerseyNumber : '')
              ),
              h('h2', { style: { color: NAVY, margin: '0 0 0.5rem' } }, data.get('familyName')),
              data.get('parents') && h('p', { style: { margin: '0 0 0.5rem' } }, h('strong', {}, 'Parents: '), data.get('parents')),
              data.get('siblings') && h('p', { style: { margin: '0 0 0.5rem' } }, h('strong', {}, 'Siblings: '), data.get('siblings')),
              h('div', { style: { marginTop: '1rem' } }, this.props.widgetFor('body'))
            )
          );
        },
      });
      CMS.registerPreviewTemplate('families', FamilyPreview);

      var CoachPreview = createClass({
        render: function () {
          var data = this.props.entry.get('data');
          var photoUrl = resolveAssetUrl(this.props.getAsset, data.get('photo'));
          var photoPosition = data.get('photoPosition') || '50% 50%';

          return h(
            'div',
            { style: { fontFamily: 'Georgia, serif', color: '#1a2634', display: 'flex', gap: '1.5rem', alignItems: 'center', padding: '1.25rem' } },
            photoUrl &&
              h('img', {
                src: photoUrl,
                alt: data.get('photoAlt') || data.get('name'),
                style: { width: '96px', height: '96px', borderRadius: '50%', objectFit: 'cover', objectPosition: photoPosition, flexShrink: 0, border: '3px solid ' + GREEN },
              }),
            h(
              'div',
              {},
              h(
                'p',
                { style: { color: GREEN_DARK, fontWeight: 700, fontSize: '0.85rem', textTransform: 'uppercase', margin: '0 0 0.25rem' } },
                data.get('role')
              ),
              h('h2', { style: { color: NAVY, margin: '0 0 0.25rem' } }, data.get('name')),
              data.get('email') && h('p', { style: { color: MUTED, margin: '0 0 0.5rem' } }, data.get('email')),
              h('div', {}, this.props.widgetFor('body'))
            )
          );
        },
      });
      CMS.registerPreviewTemplate('coaches', CoachPreview);
    </script>
  </body>
</html>
